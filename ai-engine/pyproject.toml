[project]
name = "nyayasaathi-ai-engine"
version = "1.0.0"
description = "AI Engine for NyayaSaathi — Legal Awareness Platform for India"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.3",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-openai>=0.0.5",
    "langchain-google-genai>=0.0.6",
    "openai>=1.6.0",
    "google-generativeai>=0.3.2",
    "sentence-transformers>=2.2.2",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.2",
    "python-multipart>=0.0.6",
    "langdetect>=1.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
start = "uvicorn main:app --reload --port 8001"

[tool.ruff]
line-length = 100
target-version = "py311"
