version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nyayasaathi_postgres
    environment:
      POSTGRES_USER: nyayasaathi
      POSTGRES_PASSWORD: nyayasaathi_dev
      POSTGRES_DB: nyayasaathi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyayasaathi -d nyayasaathi_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nyayasaathi_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nyayasaathi.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    profiles:
      - dev-tools

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  default:
    name: nyayasaathi_network
